  <link rel="icon" href="assets/img/logo.svg">

<body data-page="resources">
  <div data-header></div>

  <main>
    <section class="banner section--grid">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>Blog</span></nav>
        <span class="eyebrow">The Movers Rankers blog</span>
        <h1 class="h1">Growth tips for <span class="hl">moving companies.</span></h1>
        <p class="lead">Practical, no-fluff advice on getting found, winning trust and booking more moves.</p>

    </section>

        <div class="grid-3" id="posts"></div>

  <div data-footer></div>

  <script>
    document.addEventListener("mr:ready", () => {
      const { ic } = window.MR;
      // Placeholder posts — replace with real articles
      const posts = [
        ["Search", "7 fixes that help movers rank higher on Google Maps"],
        ["Reviews", "When to ask for a review (and what to say)"],
        ["AI", "What an AI receptionist can and can't do for a moving company"],
        ["Websites", "The quote form fields that actually matter"],
        ["Ads", "Are Local Services Ads worth it for small movers?"],
        ["Operations", "How to cut no-shows on estimate appointments"],
        ["Search", "Showing up when customers ask AI assistants for movers"],
        ["Seasonality", "Planning your marketing for the slow season"],
        ["Reviews", "How to respond to a negative review without making it worse"]
      ];
      document.getElementById("posts").innerHTML = posts.map(([cat, title], i) => `
        <article class="card post-card reveal">
          <a class="media" href="#"><img src="https://picsum.photos/seed/mrx-post-${i}/800/500" alt="" loading="lazy"></a>
          <div class="post-body">
            <div class="post-meta"><span class="tag">${cat}</span><span>${4 + (i % 5)} min read</span></div>
            <h2 style="font-size:19px;line-height:1.35"><a href="#">${title}</a></h2>
            <p>Placeholder excerpt — a one or two sentence summary of the article goes here.</p>
            <a class="link-arrow" href="#">Read article ${ic("arrow")}</a>
          </div>
        </article>`).join("");
    });
